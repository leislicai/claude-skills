# 政务服务政策文件 — 领域配置
# 公积金、医保、社保、税务等政务服务类政策文档通用

domain:
  id: gov-services
  name: 政务服务政策文件
  description: 公积金、医保、社保、税务等政务部门的规范性文件
  applies_to:
    - 住房公积金
    - 社会保险
    - 医疗保险
    - 税务政策
    - 行政审批

# ============================================================
# Stage 1: 知识块切分策略
# ============================================================
chunking:
  mode: hybrid
  structural_rules:
    - pattern: "^第\\s*[一二三四五六七八九十百千0-9]+\\s*条"
      boundary: after
      label: article
    - pattern: "^第\\s*[一二三四五六七八九十百千0-9]+\\s*章"
      boundary: before
      label: chapter
    - pattern: "^[一二三四五六七八九十]、"
      boundary: before
      label: section
  semantic_rules:
    completeness_threshold: 0.8 # LLM 自包含判断阈值（0-1）
    max_tokens: 2000
    min_tokens: 80
  hybrid:
    structural_first: true
    semantic_refine: true # 结构化切完用语义检查是否需要合并/再拆

# ============================================================
# Stage 2: 实体类型体系 + 关系谓词
# ============================================================
entity_types:
  - id: policy
    name: 政策法规
    description: 政策文件本身或其上位法
    examples: ["住房公积金管理条例", "关于调整缴存比例的通知"]

  - id: clause
    name: 政策条款
    description: 文件中的具体规定条目
    examples: ["缴存比例", "提取条件", "贷款额度计算"]

  - id: department
    name: 责任部门
    description: 执行或解释该条款的政府机构
    examples: ["住房公积金管理中心", "人力资源和社会保障局"]

  - id: condition
    name: 适用条件
    description: 条款生效的前提条件
    examples: ["连续缴存满6个月", "首套自住住房"]

  - id: material
    name: 办理材料
    description: 办理业务需要提交的证明文件
    examples: ["身份证", "购房合同", "贷款申请表"]

  - id: procedure
    name: 办理流程
    description: 业务办理的步骤
    examples: ["线上申请", "窗口受理", "审核审批"]

relation_predicates:
  - id: part_of
    name: 属于
    inverse: contains
    description: 条款属于某项政策，材料属于某个办理事项

  - id: references
    name: 引用
    inverse: referenced_by
    description: 此条款引用了上位法或其他条款

  - id: amends
    name: 修订
    inverse: amended_by
    description: 新政策修订了旧政策的条款

  - id: repeals
    name: 废止
    inverse: repealed_by
    description: 新政策废止了旧政策或其中条款

  - id: requires
    name: 需要
    inverse: required_by
    description: 某项流程需要某种材料，某个条件触发某个条款

# ============================================================
# Stage 3: Wiki 页面骨架
# ============================================================
wiki_skeleton:
  sections:
    - name: 政策概述
      key: overview
      source: summary
      description: 从 block.summary 聚合该实体的概要说明

    - name: 核心标准
      key: standards
      source: properties
      description: 从 entity.properties 取关键数值（比例、额度、年限）

    - name: 适用条件
      key: conditions
      source: blocks_tagged_with
      tag: condition
      description: 找出所有 tag="条件" 的 block，列出适用/不适用场景

    - name: 办理材料
      key: materials
      source: blocks_tagged_with
      tag: material
      description: 找出所有 tag="材料" 的 block，按 entity 分列

    - name: 办理流程
      key: procedure
      source: blocks_tagged_with
      tag: procedure
      description: 找出所有 tag="流程" 的 block，按时序排列

    - name: 常见问题
      key: faq
      source: derived_from_qa
      description: 从关联 QA 对反向填充，选取 confidence ≥ 0.7 的

    - name: 相关依据
      key: references
      source: relations
      description: 从图谱 relations 列出引用/修订/废止/属于该实体的其他实体

# ============================================================
# Stage 4: QA 生成模板
# ============================================================
qa_templates:
  - pattern: "{{entity.name}}的标准是什么？"
    source_section: standards
    intents: ["查询标准"]

  - pattern: "{{entity.name}}适用于什么情况？"
    source_section: conditions
    intents: ["查询条件"]

  - pattern: "办理{{entity.name}}需要什么材料？"
    source_section: materials
    intents: ["查询材料"]

  - pattern: "{{entity.name}}怎么办理？"
    source_section: procedure
    intents: ["查询流程"]

  - pattern: "{{entity.name}}和{{related_entity.name}}有什么区别？"
    source_section: overview
    intents: ["对比"]
    requires: related_entity

# ============================================================
# 质量规则
# ============================================================
quality:
  format:
    content_non_empty: true
    source_trace_valid: true
    entities_resolvable: true

  semantic:
    entity_conflict_detection: true
    conflict_action: flag_for_human_review

    stale_detection:
      enabled: true
      trigger_keywords: ["废止", "修订", "取代", "不再适用", "自.*起废止"]
      action: mark_stale

    human_review_required:
      - when: confidence < 0.7
      - when: entity_conflict_detected
      - when: new_entity_type_discovered # 发现实体类型体系中没有的新类型

  domain_specific:
    required_entity_types: ["policy", "clause"]
    prohibited_patterns: ["已废止", "已失效", "试行中"]
    prohibited_action: warn_and_flag

# ============================================================
# 级联更新触发规则
# ============================================================
cascade:
  block_changed:
    - re_extract_entities: true # 变更 block 的 entities[] 重新抽取
    - re_compile_wikis: affected # 受影响 entity 的 Wiki 标记 stale
    - re_generate_qa: affected # 受影响 Wiki 的 QA 标记 stale
